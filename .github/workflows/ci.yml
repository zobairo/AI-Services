name: checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Everything in this repo is dependency-free on purpose, so there is
      # nothing to install — the whole suite runs in seconds.
      - name: Run all checks
        run: npm test
